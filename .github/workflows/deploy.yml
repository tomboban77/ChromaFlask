name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: id-token is used to prove the deployment
# came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Rules engine, solver optimality and level generation. No browser needed,
      # so this is a genuine quality gate on every deploy.
      - name: Core tests
        run: npm run test:core

      - name: Build
        run: npx vite build

      # Drives the real game in headless Chromium: full flows, economy
      # assertions, tutorial, back button, persistence. Non-blocking until it
      # has been seen green on this runner; then drop continue-on-error so a
      # broken flow can never deploy.
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
        continue-on-error: true

      - name: End-to-end smoke test
        run: npm run test:e2e
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
