name: CI

# Quality gate on every push to main. Hosting is Vercel, which builds and
# deploys from the same commits on its own; this workflow only proves the
# commit is sound - lint, types, the rules/solver suite, a production build
# and the browser smoke test against the built game.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Locale parity
        run: npm run i18n:check

      # Rules engine, solver optimality and level generation. No browser needed,
      # so this is a genuine quality gate on every push.
      - name: Core tests
        run: npm run test:core

      - name: Build
        run: npx vite build

      # Drives the real game in headless Chromium: full flows, economy
      # assertions, tutorial, back button, persistence, skip, share, skins.
      # Blocking: it has been green on this runner since the perf pass.
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      # Output is also written next to the screenshots so a failure can be read
      # from the artifact without opening the run log.
      - name: End-to-end smoke test
        run: |
          set -o pipefail
          mkdir -p .tmp/shots
          npm run test:e2e 2>&1 | tee .tmp/shots/smoke.log

      # The smoke's verdict and problem list, readable on the run's Summary
      # page without opening the step log or downloading the artifact.
      - name: Smoke summary
        if: always()
        run: |
          {
            echo '### Smoke test'
            echo '```'
            tail -n 40 .tmp/shots/smoke.log 2>/dev/null || echo '(no smoke log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .tmp/shots
          if-no-files-found: ignore
          retention-days: 7
