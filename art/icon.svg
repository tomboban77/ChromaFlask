<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ChromaFlask app icon: rainbow-layer flask on candy purple. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06ef0"/>
      <stop offset="0.55" stop-color="#7a3fd0"/>
      <stop offset="1" stop-color="#57249c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffe9ad" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffca67" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffca67" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="flaskclip">
      <path d="M86 46 L60 152 Q54 174 74 174 L126 174 Q146 174 140 152 L114 46 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="215" r="215" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(2.2) translate(-100 -91)">
    <g clip-path="url(#flaskclip)">
      <rect x="40" y="146" width="120" height="30" fill="#ffb020"/>
      <rect x="40" y="122" width="120" height="24" fill="#f5365c"/>
      <rect x="40" y="98" width="120" height="24" fill="#a855f7"/>
      <rect x="40" y="76" width="120" height="22" fill="#22d3ee"/>
      <circle cx="82" cy="112" r="5" fill="#fff" opacity="0.4"/>
      <circle cx="112" cy="136" r="4" fill="#fff" opacity="0.35"/>
      <circle cx="98" cy="90" r="3.4" fill="#fff" opacity="0.45"/>
      <circle cx="120" cy="104" r="2.6" fill="#fff" opacity="0.4"/>
      <path d="M76 62 L68 138" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    </g>
    <path d="M86 46 L60 152 Q54 174 74 174 L126 174 Q146 174 140 152 L114 46 Z"
      fill="rgba(255,255,255,0.06)" stroke="#f2ecff" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M86 18 h28 v30 h-28 Z" fill="rgba(255,255,255,0.06)"
      stroke="#f2ecff" stroke-width="5.5" stroke-linejoin="round"/>
    <rect x="78" y="8" width="44" height="14" rx="7" fill="#e4dcff"/>
  </g>

  <!-- sparkles -->
  <path d="M118 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#fff6d8" opacity="0.9"/>
  <path d="M398 170 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#ffe08a" opacity="0.85"/>
  <path d="M380 356 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#fff6d8" opacity="0.7"/>
