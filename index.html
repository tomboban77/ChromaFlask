<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + env() insets keeps the HUD clear of notches and
         home indicators; maximum-scale stops iOS zooming on double-tap. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e2a" />
    <meta name="description" content="ChromaFlask - a liquid sort puzzle" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ChromaFlask</title>
  </head>
  <body>
    <div id="app">
      <!-- ============================================================ BOOT -->
      <section class="screen screen--active" id="screen-boot">
        <div class="boot">
          <div class="boot__logo" aria-hidden="true">
            <span class="boot__flask boot__flask--1"></span>
            <span class="boot__flask boot__flask--2"></span>
            <span class="boot__flask boot__flask--3"></span>
          </div>
          <h1 class="boot__title">Chroma<span>Flask</span></h1>
          <p class="boot__sub">Pour. Sort. Solve.</p>
          <div class="boot__bar"><i></i></div>
        </div>
      </section>

      <!-- ========================================================= PROFILE -->
      <section class="screen" id="screen-profile">
        <div class="panel panel--center">
          <h2 class="panel__title">Choose your look</h2>
          <p class="panel__hint">Saved on this device. No account needed.</p>

          <div class="avatars" id="avatar-grid" role="radiogroup" aria-label="Avatar"></div>

          <label class="field">
            <span class="field__label">Name</span>
            <input
              id="name-input"
              class="field__input"
              type="text"
              maxlength="16"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
              placeholder="Player"
            />
          </label>

          <button class="btn btn--primary btn--wide" id="btn-start-profile">
            Start playing
          </button>
          <button class="btn btn--ghost btn--wide" id="btn-guest">Skip, play as guest</button>
        </div>
      </section>

      <!-- ============================================================= MAP -->
      <section class="screen" id="screen-map">
        <header class="topbar">
          <div class="chip chip--profile" id="map-profile">
            <span class="chip__avatar" id="map-avatar">🐱</span>
            <span class="chip__name" id="map-name">Player</span>
          </div>
          <div class="topbar__spacer"></div>
          <div class="chip chip--stat" id="map-stars-chip">
            <span class="chip__icon">★</span>
            <span id="map-stars">0</span>
          </div>
          <div class="chip chip--stat" id="map-coins-chip">
            <span class="chip__icon chip__icon--coin">●</span>
            <span id="map-coins">0</span>
          </div>
          <button class="iconbtn" id="btn-settings-map" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.4-2.6.1-.9-.1-.9 1.9-1.5-1.9-3.3-2.3.8a7.6 7.6 0 0 0-1.5-.9L16.2 4h-3.8l-.4 2.2c-.5.2-1 .5-1.5.9l-2.3-.8L6.3 9.6l1.9 1.5-.1.9.1.9-1.9 1.5 1.9 3.3 2.3-.8c.5.4 1 .7 1.5.9l.4 2.2h3.8l.4-2.2c.5-.2 1-.5 1.5-.9l2.3.8 1.9-3.3-1.9-1.5Z"
              />
            </svg>
          </button>
        </header>

        <div class="map">
          <h2 class="map__title">Select a level</h2>
          <div class="map__grid" id="level-grid"></div>
          <p class="map__footnote" id="map-footnote"></p>
        </div>
      </section>

      <!-- ============================================================ GAME -->
      <section class="screen" id="screen-game">
        <header class="topbar topbar--game">
          <button class="iconbtn" id="btn-back" aria-label="Back to levels">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 4 7 12l8.5 8" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="chip chip--stat">
            <span class="chip__icon chip__icon--coin">●</span>
            <span id="game-coins">0</span>
          </div>
          <div class="topbar__spacer"></div>
          <div class="levelpill">
            <span id="game-level-label">Level 1</span>
            <small id="game-move-label">0 moves</small>
          </div>
          <div class="topbar__spacer"></div>
          <button class="iconbtn" id="btn-restart" aria-label="Restart level">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12a7 7 0 1 1-2.6-5.4M19 4v4h-4" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="iconbtn" id="btn-settings-game" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.4-2.6.1-.9-.1-.9 1.9-1.5-1.9-3.3-2.3.8a7.6 7.6 0 0 0-1.5-.9L16.2 4h-3.8l-.4 2.2c-.5.2-1 .5-1.5.9l-2.3-.8L6.3 9.6l1.9 1.5-.1.9.1.9-1.9 1.5 1.9 3.3 2.3-.8c.5.4 1 .7 1.5.9l.4 2.2h3.8l.4-2.2c.5-.2 1-.5 1.5-.9l2.3.8 1.9-3.3-1.9-1.5Z"
              />
            </svg>
          </button>
        </header>

        <!-- Pixi canvas mounts here -->
        <div class="board-host" id="board-host"></div>

        <div class="coach" id="coach" hidden>
          <p class="coach__text" id="coach-text"></p>
          <button class="coach__skip" id="coach-skip">Skip tutorial</button>
        </div>

        <footer class="powerbar" id="powerbar">
          <button class="power" id="btn-undo" aria-label="Undo last pour">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12a7 7 0 1 0 2.6-5.4M5 4v4h4" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="power__badge" id="badge-undo">3</span>
            <span class="power__label">Undo</span>
          </button>

          <button class="power" id="btn-hint" aria-label="Show a hint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v2m6.4 1.6-1.4 1.4M21 12h-2M5 12H3m3.6-5.4L8 8m4 11a5 5 0 0 1-2-9.6
                       A5 5 0 0 1 14 18.4V19a2 2 0 0 1-4 0Z" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="power__badge" id="badge-hint">3</span>
            <span class="power__label">Hint</span>
          </button>

          <button class="power" id="btn-bottle" aria-label="Add an empty bottle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 3h4v2.5l-1 1.2V20a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V6.7l-1-1.2V3h2Z"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
              <path d="M5 12h6M8 9v6" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" />
            </svg>
            <span class="power__badge" id="badge-bottle">3</span>
            <span class="power__label">Bottle</span>
          </button>
        </footer>
      </section>

      <div id="modal-root" class="modal-root"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
